name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published upstream release tag. Prereleases are allowed when selected manually; leave blank for the latest stable release.'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

concurrency:
  group: moonlight-flatpak-release
  cancel-in-progress: false

env:
  APP_ID: com.github.qiin2333.Moonlight
  MANIFEST: com.github.qiin2333.Moonlight.json
  REPOSITORY_URL: https://moonlight.barreras.dev/repo/
  RUNTIME_REPOSITORY: https://flathub.org/repo/flathub.flatpakrepo
  UPSTREAM_RELEASE_ARTIFACT: resolved-upstream-release

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Check out packaging sources
        uses: actions/checkout@v6

      - name: Resolve eligible upstream release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.version }}
        run: |
          arguments=()
          if [[ -n "$REQUESTED_TAG" ]]; then
            arguments+=(--tag "$REQUESTED_TAG")
          fi
          python3 scripts/resolve-upstream-release.py "${arguments[@]}" > upstream-release.json
          cat upstream-release.json

      - name: Decide whether this release needs a build
        id: decision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGING_COMMIT: ${{ github.sha }}
        run: |
          download_release_asset() {
            local asset_json=$1
            local destination=$2
            local asset_state
            local asset_url
            local expected_digest
            local actual_digest
            asset_state=$(jq -er '.state' <<< "$asset_json") || return 1
            asset_url=$(jq -er '.browser_download_url' <<< "$asset_json") || return 1
            expected_digest=$(jq -er '.digest' <<< "$asset_json") || return 1
            if [[ "$asset_state" != uploaded || ! "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              return 1
            fi
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 4 \
              --retry-all-errors \
              --retry-delay 2 \
              "$asset_url" \
              --output "$destination" || return 1
            actual_digest="sha256:$(sha256sum "$destination" | cut -d ' ' -f 1)"
            [[ "$actual_digest" == "$expected_digest" ]]
          }

          current_arguments=()
          latest_release_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          http_status=$(curl \
            --silent \
            --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --output latest-packaging-release.json \
            --write-out '%{http_code}' \
            "$latest_release_api")
          if [[ "$http_status" == 200 ]]; then
            latest_tag=$(jq -er '.tag_name' latest-packaging-release.json)
            metadata_asset=$(jq -c \
              '[.assets[] | select(.name == "build-metadata.json")] | if length == 1 then .[0] else empty end' \
              latest-packaging-release.json)
            if [[ -n "$metadata_asset" ]] && \
              download_release_asset "$metadata_asset" current-build-metadata.json; then
              echo "Latest packaging release $latest_tag has valid build metadata."
              current_arguments+=(--current current-build-metadata.json)
            else
              echo "Latest release $latest_tag has no usable build metadata; forcing a recovery build."
            fi
          elif [[ "$http_status" == 404 ]]; then
            echo "No published packaging release exists yet."
          else
            message=$(jq -r '.message // "unknown GitHub API error"' latest-packaging-release.json)
            echo "Unable to inspect the latest packaging release (HTTP $http_status): $message" >&2
            exit 1
          fi
          decision=$(python3 scripts/should-build.py \
            upstream-release.json \
            "${current_arguments[@]}" \
            --packaging-commit "$PACKAGING_COMMIT")
          echo "$decision" | jq .
          printf 'should_build=%s\n' "$(jq -r '.should_build' <<< "$decision")" >> "$GITHUB_OUTPUT"

      - name: Preserve resolved upstream release
        if: steps.decision.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UPSTREAM_RELEASE_ARTIFACT }}
          path: upstream-release.json
          if-no-files-found: error
          retention-days: 1

  build-and-publish:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      FLATPAK_GPG_PRIVATE_KEY_B64: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY_B64 }}
    steps:
      - name: Install build and publication tools
        run: |
          dnf install -y \
            coreutils \
            diffutils \
            findutils \
            flatpak \
            flatpak-builder \
            gh \
            git \
            gnupg2 \
            jq \
            nodejs \
            python3

      - name: Check out packaging sources
        uses: actions/checkout@v6

      - name: Restore resolved upstream release
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.UPSTREAM_RELEASE_ARTIFACT }}
          path: .

      - name: Configure Flatpak build dependencies
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive -y flathub \
            org.kde.Platform//6.10 \
            org.kde.Sdk//6.10 \
            org.flatpak.Builder//stable

      - name: Import repository signing key
        run: |
          bash scripts/import-signing-key.sh \
            "$RUNNER_TEMP/flatpak-gnupg" \
            keys/moonlight-flatpak.gpg

      - name: Create resolved build manifest
        run: |
          upstream_tag=$(jq -er '.tag' upstream-release.json)
          upstream_version=$(jq -er '.version' upstream-release.json)
          upstream_commit=$(jq -er '.commit' upstream-release.json)
          upstream_release_date=$(jq -er '.release_date' upstream-release.json)
          python3 scripts/update-manifest.py \
            "$MANIFEST" \
            generated-manifest.json \
            --tag "$upstream_tag" \
            --commit "$upstream_commit" \
            --version "$upstream_version" \
            --release-date "$upstream_release_date"
          printf 'PACKAGING_RELEASE_TAG=build-%s-r%s-a%s\n' \
            "$upstream_tag" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'BUNDLE_NAME=moonlight-qt-%s-x86_64.flatpak\n' "$upstream_tag" >> "$GITHUB_ENV"

      - name: Lint resolved manifest
        run: |
          flatpak run \
            --cwd=/tmp \
            --filesystem="$GITHUB_WORKSPACE" \
            --command=flatpak-builder-lint \
            org.flatpak.Builder \
            --exceptions \
            --user-exceptions "$PWD/flatpak-builder-lint-exceptions.json" \
            manifest \
            "$PWD/generated-manifest.json"

      - name: Build signed Flatpak repository
        run: |
          flatpak-builder \
            --repo=repo \
            --force-clean \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME" \
            build-dir \
            generated-manifest.json
          flatpak build-update-repo \
            --title='Moonlight V+ Flatpak Repository' \
            --comment='Directly distributed Moonlight V+ Flatpak updates' \
            --description='Signed Flatpak repository for Moonlight V+ releases packaged by aldobarr.' \
            --homepage='https://github.com/aldobarr/moonlight-vplus-flatpak' \
            --default-branch=master \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME" \
            --prune \
            repo

      - name: Lint build and repository
        run: |
          flatpak run \
            --cwd=/tmp \
            --filesystem="$GITHUB_WORKSPACE" \
            --command=flatpak-builder-lint \
            org.flatpak.Builder \
            --exceptions \
            --user-exceptions "$PWD/flatpak-builder-lint-exceptions.json" \
            builddir \
            "$PWD/build-dir"
          flatpak run \
            --cwd=/tmp \
            --filesystem="$GITHUB_WORKSPACE" \
            --command=flatpak-builder-lint \
            org.flatpak.Builder \
            --exceptions \
            --user-exceptions "$PWD/flatpak-builder-lint-exceptions.json" \
            repo \
            "$PWD/repo"

      - name: Create repository-backed bundle
        run: |
          flatpak build-bundle \
            --repo-url="$REPOSITORY_URL" \
            --runtime-repo="$RUNTIME_REPOSITORY" \
            --gpg-keys=keys/moonlight-flatpak.gpg \
            repo \
            "$BUNDLE_NAME" \
            "$APP_ID" \
            master

      - name: Stage repository and release assets
        run: |
          node scripts/stage-repository-assets.mjs repo release-assets --reserved-assets 2
          install -m 0644 "$BUNDLE_NAME" "release-assets/$BUNDLE_NAME"
          python3 scripts/create-build-metadata.py \
            upstream-release.json \
            release-assets/build-metadata.json \
            --repository-url "$REPOSITORY_URL" \
            --packaging-commit "$GITHUB_SHA" \
            --release-tag "$PACKAGING_RELEASE_TAG" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish-release.sh release-assets upstream-release.json
