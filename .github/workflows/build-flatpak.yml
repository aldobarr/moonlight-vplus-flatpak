name: Build Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published upstream release tag. Prereleases are allowed when selected manually; leave blank for the latest stable release.'
        required: false
        default: ''
        type: string
  #schedule:
  #  - cron: '17 */4 * * *'

permissions: {}

concurrency:
  group: moonlight-flatpak-release
  cancel-in-progress: false

env:
  APP_ID: com.github.qiin2333.Moonlight
  CLOUDFLARE_ASSET_DIRECTORY: cloudflare-assets
  FLATPAK_REPOSITORY: cloudflare-assets/repo
  MANIFEST: com.github.qiin2333.Moonlight.json
  REPOSITORY_URL: https://moonlight.barreras.dev/repo/
  RUNTIME_REPOSITORY: https://flathub.org/repo/flathub.flatpakrepo
  UPSTREAM_RELEASE_ARTIFACT: resolved-upstream-release

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Keep scheduled workflow enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-flatpak.yml/enable"

      - name: Check out packaging sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve eligible upstream release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.version }}
        run: |
          arguments=()
          if [[ -n "$REQUESTED_TAG" ]]; then
            arguments+=(--tag "$REQUESTED_TAG")
          fi
          python3 scripts/resolve-upstream-release.py "${arguments[@]}" > upstream-release.json
          jq 'del(.release_notes, .release_body)' upstream-release.json

      - name: Decide whether this release needs a build
        id: decision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_arguments=()
          release_tag=$(jq -er '.tag' upstream-release.json)
          encoded_release_tag=$(jq -rn --arg tag "$release_tag" '$tag | @uri')
          release_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_release_tag}"
          http_status=$(curl \
            --silent \
            --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --output existing-packaging-release.json \
            --write-out '%{http_code}' \
            "$release_api")
          if [[ "$http_status" == 200 ]]; then
            existing_tag=$(jq -er '.tag_name' existing-packaging-release.json)
            echo "Inspecting existing packaging release $existing_tag."
            current_arguments+=(--current-release existing-packaging-release.json)
          elif [[ "$http_status" == 404 ]]; then
            echo "No published packaging release exists for $release_tag."
          else
            message=$(jq -r '.message // "unknown GitHub API error"' existing-packaging-release.json)
            echo "Unable to inspect packaging release $release_tag (HTTP $http_status): $message" >&2
            exit 1
          fi
          decision=$(python3 scripts/should-build.py \
            upstream-release.json \
            "${current_arguments[@]}")
          echo "$decision" | jq .
          printf 'should_build=%s\n' "$(jq -r '.should_build' <<< "$decision")" >> "$GITHUB_OUTPUT"

      - name: Preserve resolved upstream release
        if: steps.decision.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UPSTREAM_RELEASE_ARTIFACT }}
          path: upstream-release.json
          if-no-files-found: error
          retention-days: 1

  build-and-publish:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: fedora:44
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and publication tools
        run: |
          dnf install -y \
            coreutils \
            findutils \
            flatpak \
            flatpak-builder \
            gh \
            git \
            gnupg2 \
            jq \
            nodejs \
            npm \
            python3

      - name: Check out packaging sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore resolved upstream release
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.UPSTREAM_RELEASE_ARTIFACT }}
          path: .

      - name: Configure Flatpak build dependencies
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive -y flathub \
            org.kde.Platform//6.10 \
            org.kde.Sdk//6.10 \
            org.flatpak.Builder//stable

      - name: Create resolved build manifest
        run: |
          upstream_tag=$(jq -er '.tag' upstream-release.json)
          upstream_version=$(jq -er '.version' upstream-release.json)
          upstream_commit=$(jq -er '.commit' upstream-release.json)
          upstream_release_date=$(jq -er '.release_date' upstream-release.json)
          upstream_release_url=$(jq -er '.html_url' upstream-release.json)
          upstream_release_notes_base64=$(jq -r '.release_notes | @base64' upstream-release.json)
          python3 scripts/update-manifest.py \
            "$MANIFEST" \
            --tag "$upstream_tag" \
            --commit "$upstream_commit" \
            --version "$upstream_version" \
            --release-date "$upstream_release_date" \
            --release-url "$upstream_release_url" \
            --release-notes-base64 "$upstream_release_notes_base64"
          release_names=$(python3 scripts/release_protocol.py "$upstream_tag")
          {
            printf 'PACKAGING_RELEASE_TAG=%s\n' "$(jq -er '.release_tag' <<< "$release_names")"
            printf 'BUNDLE_NAME=%s\n' "$(jq -er '.bundle_name' <<< "$release_names")"
          } >> "$GITHUB_ENV"

      - name: Lint resolved manifest
        run: |
          flatpak run \
            --cwd=/tmp \
            --filesystem="$GITHUB_WORKSPACE" \
            --command=flatpak-builder-lint \
            org.flatpak.Builder \
            --exceptions \
            --user-exceptions "$PWD/flatpak-builder-lint-exceptions.json" \
            manifest \
            "$PWD/$MANIFEST"

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --force-clean \
            build-dir \
            "$MANIFEST"

      - name: Lint build directory
        run: |
          flatpak run \
            --cwd=/tmp \
            --filesystem="$GITHUB_WORKSPACE" \
            --command=flatpak-builder-lint \
            org.flatpak.Builder \
            --exceptions \
            --user-exceptions "$PWD/flatpak-builder-lint-exceptions.json" \
            builddir \
            "$PWD/build-dir"

      - name: Export signed Flatpak repository
        env:
          FLATPAK_GPG_PRIVATE_KEY_B64: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY_B64 }}
        run: |
          signing_home=$(mktemp -d "$RUNNER_TEMP/flatpak-gnupg.XXXXXX")
          cleanup_signing_home() {
            gpgconf --homedir "$signing_home" --kill gpg-agent >/dev/null 2>&1 || true
            rm -rf -- "$signing_home"
          }
          trap cleanup_signing_home EXIT
          signing_key_id=$(bash scripts/import-signing-key.sh \
            "$signing_home" \
            keys/moonlight-flatpak.gpg)
          unset FLATPAK_GPG_PRIVATE_KEY_B64
          install -d "$CLOUDFLARE_ASSET_DIRECTORY"
          flatpak-builder \
            --export-only \
            --repo="$FLATPAK_REPOSITORY" \
            --gpg-sign="$signing_key_id" \
            --gpg-homedir="$signing_home" \
            build-dir \
            "$MANIFEST"
          flatpak build-update-repo \
            --title='Moonlight V+ Flatpak Repository' \
            --comment='Directly distributed Moonlight V+ Flatpak updates' \
            --description='Signed Flatpak repository for Moonlight V+ releases packaged by aldobarr.' \
            --homepage='https://github.com/aldobarr/moonlight-vplus-flatpak' \
            --default-branch=master \
            --gpg-sign="$signing_key_id" \
            --gpg-homedir="$signing_home" \
            "$FLATPAK_REPOSITORY"

      - name: Lint repository
        run: |
          flatpak run \
            --cwd=/tmp \
            --filesystem="$GITHUB_WORKSPACE" \
            --command=flatpak-builder-lint \
            org.flatpak.Builder \
            --exceptions \
            --user-exceptions "$PWD/flatpak-builder-lint-exceptions.json" \
            repo \
            "$PWD/$FLATPAK_REPOSITORY"

      - name: Create repository-backed bundle
        run: |
          flatpak build-bundle \
            --repo-url="$REPOSITORY_URL" \
            --runtime-repo="$RUNTIME_REPOSITORY" \
            --gpg-keys=keys/moonlight-flatpak.gpg \
            "$FLATPAK_REPOSITORY" \
            "$BUNDLE_NAME" \
            "$APP_ID" \
            master

      - name: Stage release asset
        run: |
          install -d release-assets
          install -m 0644 "$BUNDLE_NAME" "release-assets/$BUNDLE_NAME"

      - name: Install Cloudflare deployment tool
        run: npm ci --prefix cloudflare-worker --no-audit --no-fund

      - name: Publish release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish-release.sh \
            release-assets \
            upstream-release.json \
            "$CLOUDFLARE_ASSET_DIRECTORY" \
            cloudflare-worker
