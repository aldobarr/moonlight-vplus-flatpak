name: Backfill Flatpaks
run-name: Backfill Flatpaks from ${{ inputs.minimum_version }}

on:
  workflow_dispatch:
    inputs:
      minimum_version:
        description: 'Minimum upstream version to build, such as v6.3.0.'
        required: true
        type: string

permissions:
  actions: write
  checks: read
  contents: read

env:
  UPSTREAM_REPOSITORY: qiin2333/moonlight-qt

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Build missing stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          MINIMUM_VERSION: ${{ inputs.minimum_version }}
        run: |
          set -euo pipefail

          version_pattern='^v?([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if [[ ! "$MINIMUM_VERSION" =~ $version_pattern ]]; then
            echo "Minimum version must use the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          minimum_version=$(jq -cn \
            --arg major "${BASH_REMATCH[1]}" \
            --arg minor "${BASH_REMATCH[2]}" \
            --arg patch "${BASH_REMATCH[3]}" \
            '[$major, $minor, $patch] | map(tonumber)')

          gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" > latest-upstream-release.json
          latest_tag=$(jq -er '
            select(.draft == false and .prerelease == false)
            | .tag_name
            | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))
          ' latest-upstream-release.json)
          latest_version=$(jq -cn --arg tag "$latest_tag" '
            $tag
            | capture("^v?(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)$")
            | [.major, .minor, .patch]
            | map(tonumber)
          ')

          gh api --paginate --slurp \
            "repos/$UPSTREAM_REPOSITORY/releases?per_page=100" \
            > upstream-release-pages.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > packaging-release-pages.json

          jq -r \
            --argjson minimum "$minimum_version" \
            --argjson latest "$latest_version" '
              def version:
                capture("^v?(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)$")
                | [.major, .minor, .patch]
                | map(tonumber);

              [
                .[][]
                | select(.draft == false and .prerelease == false)
                | select(.tag_name | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))
                | {tag: .tag_name, version: (.tag_name | version)}
                | select(.version >= $minimum and .version <= $latest)
              ]
              | sort_by(.version)
              | .[].tag
            ' upstream-release-pages.json > stable-tags.txt

          jq -r '
            .[][]
            | select(.draft == false)
            | .tag_name
          ' packaging-release-pages.json \
            | sed -nE 's/^build-(v?[0-9][0-9A-Za-z._+-]*)-r[1-9][0-9]*-a[1-9][0-9]*$/\1/p' \
            > packaged-tags.txt

          while IFS= read -r upstream_tag; do
            if grep -Fxq "$upstream_tag" packaged-tags.txt; then
              echo "Skipping $upstream_tag because it already has a published Flatpak release."
              continue
            fi

            echo "Starting Flatpak release for $upstream_tag."
            run_url=$(gh workflow run build-flatpak.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME" \
              -f "version=$upstream_tag")
            run_url_pattern="^https://github\\.com/$GITHUB_REPOSITORY/actions/runs/([1-9][0-9]*)$"
            if [[ ! "$run_url" =~ $run_url_pattern ]]; then
              echo "Unable to identify the workflow run for $upstream_tag: $run_url" >&2
              exit 1
            fi
            run_id=${BASH_REMATCH[1]}

            gh run watch "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --exit-status
          done < stable-tags.txt
